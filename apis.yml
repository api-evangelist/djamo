name: Djamo
description: >-
  Djamo is a mobile-first fintech serving Côte d'Ivoire and Sénégal, giving 1.5M+
  users current and savings accounts with an IBAN, virtual and physical Visa cards,
  money transfers to Mobile Money and bank accounts, bill payments, short-term
  credit, and BRVM investment products. For businesses, Djamo exposes a REST
  Business API that lets companies collect payments ("Pay with Djamo"), send single
  and mass transfers to recipients by phone number, check their real-time balance,
  and manage marketplace sub-companies, secured with bearer tokens and HMAC-signed
  webhooks. Djamo is a Y Combinator alumnus backed by investors including Partech.
