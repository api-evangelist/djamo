  ref: authentication/djamo-authentication.yml
idempotency:
  supported: true
  mechanism: caller-supplied-reference
  fields:
    - name: externalId
      scope: charges (POST /v1/charges)
      description: Merchant's own transaction reference; reusing it to create two different charges returns HTTP 409.
    - name: reference
      scope: transactions (POST /v1/transactions)
      description: Caller-supplied internal identifier used for idempotency and reconciliation; also queryable via GET /v1/transactions?reference={value}.
  collision_status: 409
  notes: >-
    Djamo does not use a dedicated Idempotency-Key header; instead each write carries
    a caller-owned reference (externalId for charges, reference for transactions).
    A repeated reference for a distinct request yields a 409 collision, giving
    at-most-once semantics per reference.
